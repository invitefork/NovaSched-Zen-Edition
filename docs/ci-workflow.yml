# 启用方法：把这个文件移动到 .github/workflows/ci.yml 并提交（需要 workflow 权限的 token）。

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Rust tests and UI checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: cargo test
        run: cargo test --manifest-path native/Cargo.toml --locked --offline
      - name: profile generation check
        run: python3 scripts/generate-profiles.py --check
      - name: UI static checks
        run: node scripts/test-glass-ui.cjs
      - name: UI DOM scenarios
        run: node scripts/test-webui-dom.cjs
      - name: glass renderer scheduling regression
        run: node scripts/test-glass-performance.cjs
      - name: profile byte-exact cross-check
        run: node scripts/check-profiles.cjs

  build:
    name: Build module and package release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          add-to-path: false
      - name: Build module ELF and package
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CARGO: cargo
        run: |
          bash scripts/build.sh
          python3 scripts/package-release.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NovaSched-*-release.zip
            dist/NovaSched-*-source.zip
            dist/NovaSched-*-webui-update.zip
            dist/NovaSched-*-SHA256SUMS.txt
          body_path: dist/NovaSched-*-SHA256SUMS.txt
          generate_release_notes: true
